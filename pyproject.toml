[project]
name = "midterm-project-ml-zoomcamp"
version = "0.1.0"
description = "Predict late delivery risk for Olist orders and serve predictions with FastAPI."
readme = "README.md"
authors = [
    { name = "Mateus Torres", email = "mmtorres230726@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "delivery_risk"

[tool.uv]
package = false
